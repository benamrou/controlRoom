<nav class="navbar navbar-expand-lg fixed-top"
     *ngIf="_userService.userInfo">
    <p-toast position="top-right"></p-toast>

    <p-dialog header="Notification" [visible]="displaySwitch"  [style]="{width: '50vw'}"  [maximizable]="false">
        <span>{{msgDisplayed}}</span>
            <p-footer>
                <button style="float: right; margin-bottom:0.5em"
                        type="button" pButton icon="fas fa-check" iconPos="right" (click)="displaySwitch=false"
                        label="Ok">
                </button>
            </p-footer>
    </p-dialog>

    <p-dialog header="Change password" [(visible)]="changePasswordVisible" [modal]="true"
        [style]="{width: '26rem'}" [closable]="!changePasswordBusy" (onHide)="closeChangePasswordDialog()">
        <div class="p-fluid formgrid grid">
            <div class="field col-12">
                <label for="hdrPwdCurrent">Current password</label>
                <input id="hdrPwdCurrent" pInputText type="password" [(ngModel)]="passwordForm.current"
                    autocomplete="current-password" [disabled]="changePasswordBusy" />
            </div>
            <div class="field col-12">
                <label for="hdrPwdNew">New password</label>
                <input id="hdrPwdNew" pInputText type="password" [(ngModel)]="passwordForm.newPassword"
                    autocomplete="new-password" [disabled]="changePasswordBusy" />
            </div>
            <div class="field col-12">
                <label for="hdrPwdConfirm">Confirm new password</label>
                <input id="hdrPwdConfirm" pInputText type="password" [(ngModel)]="passwordForm.confirm"
                    autocomplete="new-password" [disabled]="changePasswordBusy" />
            </div>
        </div>
        <p-footer>
            <button type="button" pButton label="Cancel" class="p-button-text"
                (click)="closeChangePasswordDialog()" [disabled]="changePasswordBusy"></button>
            <button type="button" pButton label="Save" icon="pi pi-check"
                (click)="submitChangePassword()" [loading]="changePasswordBusy"></button>
        </p-footer>
    </p-dialog>

        <div class="pos-f-t fixed-top header">
            <nav class="navbar navbar-inverse bg-inverse navbar-toggleable-md summer-header">

                <button class="navbar-toggler navbar-toggler-right" (click)="toggleSidebar()" data-bs-toggle="dropdown">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <a class="navbar-brand" [ngStyle]="{'color': appForegroundColorEnvironment}" style="padding-left: 2%">
                    {{appEnvironment}}
                </a>

                <!-- Summer badge -->
                <div class="summer-badge">
                    <span>🌴 Summer mode</span>
                </div>

                <div class="collapse navbar-collapse justify-content-end" id="navbarTogglerDemo02" style="padding-right: 3%">
                    <ul class="navbar-nav ml-auto mt-2 mt-md-0">

        <!-- AI mode toggle — visible to aiAdmin and aiDesigner only -->
                        <li *ngIf="menuAccess.showAiModeToggle()"
                            class="nav-item ai-mode-toggle-item">
                            <button class="ai-mode-btn"
                                    [class.ai-mode-btn--active]="_userService.userInfo.aiMenuMode"
                                    (click)="_userService.userInfo.aiMenuMode = !_userService.userInfo.aiMenuMode"
                                    [title]="_userService.userInfo.aiMenuMode ? 'Switch to standard menu' : 'Switch to AI menu'">
                                <i class="fas fa-robot"></i>
                                <span class="ai-mode-label">AI</span>
                                <span class="ai-mode-state">{{ _userService.userInfo.aiMenuMode ? 'ON' : 'OFF' }}</span>
                            </button>
                        </li>

        <!-- Panel Environment selection (GOLD central — Prod, Preprod, etc.) -->
                        <li *ngIf="environments.length > 0" class="nav-item dropdown adh-env-dropdown">
                            <a class="nav-link dropdown-toggle" href="javascript:void(0)" data-bs-toggle="dropdown"
                               [title]="'Database: ' + (selectedEnvironment || 'Environment')">
                                <i class="fa fa-database"></i>
                                <span class="env-current-label" *ngIf="selectedEnvironment">{{ selectedEnvironment }}</span>
                                <b class="caret"></b><span class="sr-only"></span>
                            </a>
                            <div class="dropdown-menu dropdown-menu-right summer-dropdown">
                                <a *ngFor="let environment of environments" class="dropdown-item"
                                    [class.active]="environment.value?.type === envTypeConnected"
                                    (click)="environmentChange(environment.label, environment.value.type)">{{ environment.label }}
                                </a>
                            </div>
                        </li>

        <!-- Panel Language -->
                        <li class="nav-item dropdown">
                            <a href="javascript:void(0)" class="nav-link dropdown-toggle" [ngClass]="{'isDisabled':this._userService.userInfo.type=='2'}" data-bs-toggle="dropdown">
                                <i class="fa fa-language"></i> <b class="caret"></b>
                            </a>
                            <div class="dropdown-menu dropdown-menu-right summer-dropdown">
                                <a class="dropdown-item" (click)="changeLang('us_US')">American</a>
                                <a class="dropdown-item" (click)="changeLang('en_EN')">English</a>
                                <a class="dropdown-item" (click)="changeLang('fr_FR')">French</a>
                            </div>
                        </li>

        <!-- Panel Profile -->
                        <li class="nav-item dropdown">
                            <a href="javascript:void(0)" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
                                <i class="fa fa-user"></i> {{_userService.userInfo.userNameDisplay}} <b class="caret"></b>
                            </a>
                            <div class="dropdown-menu dropdown-menu-right summer-dropdown">
                                <a *ngFor="let item of menuAccess.profileMenu$ | async" class="dropdown-item"
                                    href="javascript:void(0)"
                                    [ngClass]="{'isDisabled': isProfileMenuDisabled(item)}"
                                    (click)="onProfileMenuAction(item, $event)">
                                    <i [ngClass]="menuIconClass(item.ICON_CLASS)"></i> {{ item.LABEL_TEXT }}
                                </a>
                            </div>
                        </li>
                    </ul>
                </div>

            </nav>
        </div>
</nav>
